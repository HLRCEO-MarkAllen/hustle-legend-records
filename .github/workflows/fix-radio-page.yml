name: Fix HLR Radio Page

on:
  push:
    paths:
      - '.github/workflows/fix-radio-page.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update live radio copy and full-page visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('radio/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
            'The HLR-controlled radio layer: programming, catalog routing, station clock and a player already wired to switch from the distributed fallback to HLR-hosted radio media as soon as the private source archive is ingested.',
            'The HLR-controlled radio layer: programming, catalog routing, station clock and direct first-party playback from dedicated HLR radio copies of Born 2 Be A Legend.'
          )
          s = s.replace(
            'Full 20-track B2BAL station manifest loaded. Direct HLR playback is source-ready; Spotify remains the temporary fallback until radio derivatives are safely generated from the private archive.',
            'Full 20-track B2BAL station manifest loaded. Direct HLR playback is live from dedicated 96 kbps radio derivatives while sales-quality files and masters remain private.'
          )
          marker = '  </style>'
          rule = '    #listen .section .wrap.reveal{opacity:1!important;transform:none!important}\n'
          if rule not in s:
            s = s.replace(marker, rule + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-radio-page.yml
          git config user.name "HLR Radio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Polish live HLR Radio page"
          git push
